<div class="container">
    <h1>Registro de Usuario</h1>
    
<form>
    <label for="nombre">Nombre: <br>
        <input type="text" required placeholder="Ingresa tu nombre">
    </label>

    <label for="apellido">Apellido: <br>
        <input type="text" required placeholder="Ingresa tu apellido">
    </label>

    <label for="correo">Correo Electrónico: <br>
    <input type="email" required placeholder="Ingresa tu correo electrónico">
    </label>

    <label for="contraseña">Contraseña: <br>
        <input type="password" required placeholder="Ingresa tu contraseña">
    </label>


    <button [routerLink]="['/eventos']">
      Registrarse
    </button>

</form>
</div>
